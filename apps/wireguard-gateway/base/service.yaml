apiVersion: v1
kind: Service
metadata:
  name: wireguard-gateway
  labels:
    app: wireguard-gateway
spec:
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: wireguard-udp
      port: 51820
      targetPort: 51820
      nodePort: 31820
      protocol: UDP
  selector:
    app: wireguard-gateway

