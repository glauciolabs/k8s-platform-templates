        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: GEMINI_API_KEY
        - name: MSAL_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_REDIRECT_URI
        - name: MSAL_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_TENANT_ID
