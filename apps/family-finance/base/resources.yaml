apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-core-api
  namespace: family-finance
  labels:
    app: finance-core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-core-api
  template:
    metadata:
      labels:
        app: finance-core-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: core-api
        image: ghcr.io/glauciocampos/finance-core-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
        env:
        - name: PORT
          value: "4001"
        - name: INTERNAL_SERVICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: INTERNAL_SERVICE_API_KEY
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: CLOUDFLARE_ACCOUNT_ID
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: GEMINI_API_KEY
        - name: MSAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_CLIENT_ID
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: CLOUDFLARE_API_TOKEN
        - name: CLOUDFLARE_D1_DATABASE_ID
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: CLOUDFLARE_D1_DATABASE_ID
        - name: MSAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_CLIENT_SECRET
        - name: MSAL_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_REDIRECT_URI
        - name: MSAL_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: family-finance-secrets
              key: MSAL_TENANT_ID
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: finance-core-api
  namespace: family-finance
spec:
  selector:
    app: finance-core-api
  ports:
  - port: 4001
    targetPort: 4001
---
