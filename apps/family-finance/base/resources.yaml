apiVersion: v1
kind: Service
metadata:
  name: finance-bff
  namespace: family-finance
spec:
  selector:
    app: finance-bff
  ports:
  - port: 80
    targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-bff
  namespace: family-finance
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "5bf6bf0d-fe5a-40fc-adf1-887f866992e3.cfargotunnel.com"
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/target: "5bf6bf0d-fe5a-40fc-adf1-887f866992e3.cfargotunnel.com"
spec:
  ingressClassName: traefik
  rules:
  - host: finance.glauciolabs.work
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finance-bff
            port:
              number: 80
  tls:
  - hosts:
    - finance.glauciolabs.work
    secretName: finance-bff-tls
