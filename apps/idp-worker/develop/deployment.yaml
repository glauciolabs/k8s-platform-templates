apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      serviceAccountName: idp-kubernetes-reader
      nodeSelector:
        environment: develop
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: app
          env:
            - name: PORT
              value: "8080"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: idp-github-app
                  key: app-id
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: idp-github-app
                  key: installation-id
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /var/run/secrets/idp-github-app/private-key.pem
          volumeMounts:
            - name: github-app-private-key
              mountPath: /var/run/secrets/idp-github-app
              readOnly: true
      volumes:
        - name: github-app-private-key
          secret:
            secretName: idp-github-app
            items:
              - key: private-key.pem
                path: private-key.pem
