apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-home
  labels:
    app: adguard-home
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.kubernetes.io/cloudflare-proxied: "false"
    traefik.ingress.kubernetes.io/router.middlewares: redirect-to-https@kubernetescrd
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "adguard_session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "lax"
spec:
  ingressClassName: traefik
  rules:
    - host: adguard.glauciolabs.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-home-web
                port:
                  number: 80
  tls:
    - hosts:
        - adguard.glauciolabs.work
      secretName: adguard-home-tls

