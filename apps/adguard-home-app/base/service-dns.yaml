apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  labels:
    app: adguard-home
spec:
  selector:
    app: adguard-home
  type: NodePort
  externalTrafficPolicy: Local
  ports:
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
      nodePort: 30053
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
      nodePort: 30053

