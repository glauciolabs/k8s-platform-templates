apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: drupal-app-develop

patches:
  - path: image-patch.yaml
  - target:
      kind: Deployment
      name: drupal-mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /databases/drupal-app-develop/drupal-mysql
  - target:
      kind: Deployment
      name: drupal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /dados/drupal-app-develop/drupal-files
  - target:
      kind: Ingress
      name: drupal
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: blog.develop.glauciolabs.work
      - op: replace
        path: /spec/tls/0/hosts/0
        value: blog.develop.glauciolabs.work
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: drupal-app-develop-redirect-to-https@kubernetescrd
