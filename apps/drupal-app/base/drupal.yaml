apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drupal
  template:
    metadata:
      labels:
        app: drupal
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - h89-1
                - h89-2
      initContainers:
        - name: init-drupal
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/files/translations
              chown -R 33:33 /mnt/files
              chmod -R 775 /mnt/files
              cp /config/settings.php /mnt/files/settings.php
              chown 33:33 /mnt/files/settings.php
              chmod 666 /mnt/files/settings.php
          volumeMounts:
            - name: drupal-files
              mountPath: /mnt/files
            - name: drupal-settings-config
              mountPath: /config
      containers:
        - name: drupal
          image: drupal:10-fpm-alpine
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "ln -sf /opt/drupal/web/sites/default/files/settings.php /opt/drupal/web/sites/default/settings.php && chown -R www-data:www-data /opt/drupal/web/sites/default"]
          ports:
            - containerPort: 80
              name: http
          env:
            - name: DRUPAL_DB_HOST
              value: drupal-mysql
            - name: DRUPAL_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: drupal-db-credentials
                  key: MYSQL_DATABASE
            - name: DRUPAL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: drupal-db-credentials
                  key: MYSQL_USER
            - name: DRUPAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: drupal-db-credentials
                  key: MYSQL_PASSWORD
            - name: DRUPAL_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: drupal-runtime
                  key: DRUPAL_HASH_SALT
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: drupal-files
              mountPath: /opt/drupal/web/sites/default/files
      volumes:
        - name: drupal-settings-config
          configMap:
            name: drupal-settings
        - name: drupal-files
          hostPath:
            path: /dados/drupal-app-production/drupal-files
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: drupal
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: drupal
