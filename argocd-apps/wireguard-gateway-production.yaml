apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wireguard-gateway-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glauciolabs/k8s-platform-templates.git
    targetRevision: master
    path: apps/wireguard-gateway/production
  destination:
    server: https://kubernetes.default.svc
    namespace: wireguard-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

