apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/glauciolabs/jellyfin-app.git
    targetRevision: production
    path: app/production
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
